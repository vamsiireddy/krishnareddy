<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CI/CD Practice App</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #1d2671, #c33764);
            color: white;
        }

        header {
            background: rgba(0, 0, 0, 0.4);
            padding: 20px;
            text-align: center;
            font-size: 28px;
            font-weight: bold;
        }

        .container {
            padding: 30px;
            max-width: 900px;
            margin: auto;
        }

        .card {
            background: white;
            color: #333;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .card h2 {
            color: #c33764;
        }

        .btn {
            display: inline-block;
            padding: 12px 25px;
            background: #1d2671;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            margin-top: 10px;
            transition: 0.3s;
        }

        .btn:hover {
            background: #c33764;
        }

        footer {
            text-align: center;
            padding: 15px;
            background: rgba(0,0,0,0.4);
            font-size: 14px;
        }
    </style>
</head>

<body>

<header>
    🚀 CI/CD Practice Application
</header>

<div class="container">

    <div class="card">
        <h2>Welcome</h2>
        <p>
            This application is deployed using
            <b>Git, Jenkins, Maven, and Tomca
