<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flowers by Vamsi Krishna Reddy</title>

<style>
    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #1d2671, #c33764);
        color: white;
        text-align: center;
        overflow-x: hidden;
    }

    h1 {
        margin-top: 30px;
        font-size: 42px;
        letter-spacing: 2px;
    }

    h2 {
        margin-bottom: 40px;
        font-weight: normal;
    }

    .garden {
        display: flex;
        justify-content: center;
        gap: 40px;
        flex-wrap: wrap;
        padding-bottom: 60px;
    }

    .flower {
        position: relative;
        width: 120px;
        height: 120px;
        animation: float 4s ease-in-out infinite;
    }

    .petal {
        position: absolute;
        width: 50px;
        height: 50px;
        border-radius: 50%;
        top: 35px;
        left: 35px;
    }

    .p1 { transform: rotate(0deg) translate(40px); }
    .p2 { transform: rotate(60deg) translate(40px); }
    .p3 { transform: rotate(120deg) translate(40px); }
    .p4 { transform: rotate(180deg) translate(40px); }
    .p5 { transform: rotate(240deg) translate(40px); }
    .p6 { transform: rotate(300deg) translate(40px); }

    .center {
        position: absolute;
        width: 35px;
        height: 35px;
        background: yellow;
        border-radius: 50%;
        top: 42px;
        left: 42px;
        box-shadow: 0 0 10px rgba(255,255,0,0.8);
    }

    /* Flower Colors */
    .pink .petal { background: #ff5fa2; }
    .blue .petal { background: #4facfe; }
    .orange .petal { background: #ff9f43; }
    .purple .petal { background: #a55eea; }
    .green .petal { background: #2ecc71; }

    @keyframes float {
        0% { transform: translateY(0); }
        50% { transform: translateY(-15px); }
        100% { transform: translateY(0); }
    }

    footer {
        margin-top: 20px;
        font-size: 14px;
        opacity: 0.8;
    }
</style>
</head>

<body>

<h1>🌸 Flower Garden 🌼</h1>
<h2>Created by <b>Vamsi Krishna Reddy</b></h2>

<div class="garden">

    <div class="flower pink">
        <div class="petal p1"></div>
        <div class="petal p2"></div>
        <div class="petal p3"></div>
        <div class="petal p4"></div>
        <div class="petal p5"></div>
        <div class="petal p6"></div>
        <div class="center"></div>
    </div>

    <div class="flower blue">
        <div class="petal p1"></div>
        <div class="petal p2"></div>
        <div class="petal p3"></div>
        <div class="petal p4"></div>
        <div class="petal p5"></div>
        <div class="petal p6"></div>
        <div class="center"></div>
    </div>

    <div class="flower orange">
        <div class="petal p1"></div>
        <div class="petal p2"></div>
        <div class="petal p3"></div>
        <div class="petal p4"></div>
        <div class="petal p5"></div>
        <div class="petal p6"></div>
        <div class="center"></div>
    </div>

    <div class="flower purple">
        <div class="petal p1"></div>
        <div class="petal p2"></div>
        <div class="petal p3"></div>
        <div class="petal p4"></div>
        <div class="petal p5"></div>
        <div class="petal p6"></div>
        <div class="center"></div>
    </div>

    <div class="flower green">
        <div class="petal p1"></div>
        <div class="petal p2"></div>
        <div class="petal p3"></div>
        <div class="petal p4"></div>
        <div class="petal p5"></div>
        <div class="petal p6"></div>
        <div class="center"></div>
    </div>

</div>

<footer>
🌈 CI/CD Practice Project • Deployed via Jenkins & Tomcat
</footer>

</body>
</html>
